<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — Smart Question Paper Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@300;400;500;600&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --indigo: #6366f1;
      --teal: #10b981;
      --surface: #0f172a;
      --surface-2: #1e293b;
      --surface-3: #334155;
      --surface-4: #475569;
      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;
      --sidebar-w: 240px;
      --sidebar-collapsed: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--surface);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ══ SIDEBAR ══ */
    .sidebar {
      width: var(--sidebar-w); background: var(--surface-2);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex; flex-direction: column;
      transition: width 0.3s cubic-bezier(0.4,0,0.2,1);
      overflow: hidden; flex-shrink: 0; position: relative; z-index: 10;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed); }

    .sidebar-header {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); min-height: 64px;
    }
    .sidebar-logo {
      width: 32px; height: 32px; background: var(--indigo);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
    }
    .sidebar-brand { display: flex; flex-direction: column; overflow: hidden; transition: opacity 0.2s, width 0.3s; }
    .sidebar.collapsed .sidebar-brand { opacity: 0; width: 0; }
    .sidebar-brand .brand-name { font-family: 'Google Sans', sans-serif; font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; }
    .sidebar-brand .brand-sub { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

    .sidebar-nav { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }

    .nav-section-label {
      font-size: 10px; font-weight: 600; color: var(--surface-4);
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 8px 8px 4px; white-space: nowrap; overflow: hidden; transition: opacity 0.2s;
    }
    .sidebar.collapsed .nav-section-label { opacity: 0; }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      color: var(--text-muted); font-size: 14px; font-weight: 500;
      transition: all 0.15s ease; white-space: nowrap; text-decoration: none; position: relative;
    }
    .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
    .nav-item.active { background: rgba(99,102,241,0.15); color: #818cf8; }
    .nav-item.active::before { content:''; position:absolute; left:0; top:20%; height:60%; width:3px; background:var(--indigo); border-radius:0 3px 3px 0; }
    .nav-icon { font-size: 18px; flex-shrink: 0; width: 24px; text-align: center; }
    .nav-label { transition: opacity 0.2s; overflow: hidden; }
    .sidebar.collapsed .nav-label { opacity: 0; width: 0; }

    .nav-item[data-tooltip]::after {
      content: attr(data-tooltip); position: absolute; left: calc(100% + 10px); top: 50%;
      transform: translateY(-50%); background: var(--surface-3); color: var(--text-primary);
      font-size: 12px; padding: 5px 10px; border-radius: 6px;
      white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.15s; z-index: 100;
    }
    .sidebar.collapsed .nav-item[data-tooltip]:hover::after { opacity: 1; }

    .sidebar-footer { padding: 12px 8px; border-top: 1px solid rgba(255,255,255,0.06); }
    .user-card { display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:8px; cursor:pointer; transition:background 0.15s; }
    .user-card:hover { background: rgba(255,255,255,0.05); }
    .avatar { width:32px; height:32px; background:linear-gradient(135deg,var(--indigo),#818cf8); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; flex-shrink:0; }
    .user-info { overflow:hidden; transition:opacity 0.2s, width 0.3s; }
    .sidebar.collapsed .user-info { opacity:0; width:0; }
    .user-name { font-size:13px; font-weight:600; color:#fff; white-space:nowrap; }
    .user-role { font-size:11px; color:var(--text-muted); white-space:nowrap; }

    .collapse-btn {
      position:absolute; right:-12px; top:50%; transform:translateY(-50%);
      width:24px; height:24px; background:var(--surface-3); border:1px solid rgba(255,255,255,0.1);
      border-radius:50%; display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-size:12px; color:var(--text-muted); transition:all 0.2s; z-index:20;
    }
    .collapse-btn:hover { background:var(--indigo); color:#fff; }
    .sidebar.collapsed .collapse-btn { transform:translateY(-50%) rotate(180deg); }

    /* ══ MAIN ══ */
    .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    .topbar {
      height:64px; border-bottom:1px solid rgba(255,255,255,0.06);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 28px; background:var(--surface-2); flex-shrink:0;
    }
    .topbar-left h1 { font-family:'Google Sans',sans-serif; font-size:18px; font-weight:700; color:#fff; }
    .topbar-left p { font-size:12px; color:var(--text-muted); margin-top:1px; }
    .topbar-actions { display:flex; align-items:center; gap:10px; }

    .btn-ghost {
      background:transparent; border:1.5px solid var(--surface-3); color:var(--text-muted);
      font-size:13px; font-weight:500; padding:8px 16px; border-radius:9px;
      cursor:pointer; transition:all 0.2s; font-family:'Inter',sans-serif;
      display:flex; align-items:center; gap:7px;
    }
    .btn-ghost:hover { border-color:var(--surface-4); color:var(--text-primary); background:rgba(255,255,255,0.04); }

    .btn-export {
      background:var(--indigo); border:none; color:#fff;
      font-size:13px; font-weight:600; padding:9px 20px; border-radius:9px;
      cursor:pointer; transition:all 0.2s; font-family:'Google Sans',sans-serif;
      display:flex; align-items:center; gap:8px; position:relative; overflow:hidden;
    }
    .btn-export:hover { background:#4f46e5; box-shadow:0 4px 14px rgba(99,102,241,0.4); transform:translateY(-1px); }
    .btn-export:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }

    /* ══ CONTENT AREA ══ */
    .content { flex:1; overflow-y:auto; padding:28px 36px; display:flex; gap:24px; }

    /* Left column — controls */
    .controls-col { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }

    .ctrl-card {
      background:var(--surface-2); border:1px solid rgba(255,255,255,0.07);
      border-radius:14px; padding:18px;
    }
    .ctrl-title { font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.07em; margin-bottom:12px; }

    .ctrl-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px;
    }
    .ctrl-item:last-child { border-bottom:none; padding-bottom:0; }
    .ctrl-item .label { color:var(--text-muted); }
    .ctrl-item .value { color:#fff; font-weight:600; font-size:12px; }

    .part-tab-row { display:flex; flex-direction:column; gap:6px; }
    .part-tab {
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      border-radius:9px; cursor:pointer; font-size:13px; font-weight:500;
      color:var(--text-muted); transition:all 0.15s; border:1.5px solid transparent;
    }
    .part-tab:hover { background:rgba(255,255,255,0.04); color:var(--text-primary); }
    .part-tab.active { background:rgba(99,102,241,0.1); color:#818cf8; border-color:rgba(99,102,241,0.25); }
    .part-tab .tab-badge { margin-left:auto; font-size:11px; background:var(--surface-3); color:var(--text-muted); padding:2px 8px; border-radius:20px; }
    .part-tab.active .tab-badge { background:rgba(99,102,241,0.2); color:#818cf8; }

    /* ══ PAPER AREA ══ */
    .paper-col { flex:1; min-width:0; }

    /* The actual paper — white card */
    .paper-sheet {
      background:#fff; color:#1a1a1a;
      border-radius:4px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 20px 60px rgba(0,0,0,0.5);
      max-width: 740px; margin: 0 auto;
      padding: 48px 52px;
      animation: fadeUp 0.5s ease both;
      position:relative;
    }

    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

    /* Paper header */
    .paper-header { text-align:center; border-bottom:2px solid #1a1a1a; padding-bottom:18px; margin-bottom:20px; }
    .paper-institution { font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1a1a1a; }
    .paper-dept { font-size:12px; color:#444; margin-top:3px; }
    .paper-title { font-size:17px; font-weight:700; text-transform:uppercase; margin:14px 0 6px; letter-spacing:0.04em; }
    .paper-sub { font-size:13px; color:#222; font-weight:600; }

    .paper-meta {
      display:grid; grid-template-columns:1fr 1fr 1fr;
      gap:0; font-size:12px; border:1px solid #ccc;
      margin-bottom:22px;
    }
    .meta-cell { padding:7px 12px; border-right:1px solid #ccc; }
    .meta-cell:last-child { border-right:none; }
    .meta-cell .meta-label { color:#666; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; }
    .meta-cell .meta-val { font-weight:700; font-size:13px; color:#1a1a1a; margin-top:2px; }

    /* Part A */
    .part-heading {
      font-size:13px; font-weight:700; text-transform:uppercase;
      letter-spacing:0.06em; border-bottom:1.5px solid #1a1a1a;
      padding-bottom:6px; margin-bottom:14px; display:flex; justify-content:space-between;
    }
    .part-instruction { font-size:11px; color:#555; font-style:italic; margin-bottom:14px; }

    .part-a-table { width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:28px; }
    .part-a-table th { background:#f5f5f5; text-align:left; padding:7px 10px; font-size:11px; font-weight:700; border:1px solid #ccc; text-transform:uppercase; }
    .part-a-table td { padding:8px 10px; border:1px solid #ccc; vertical-align:top; line-height:1.5; }
    .part-a-table .q-num { width:36px; text-align:center; font-weight:700; }
    .part-a-table .q-unit { width:48px; text-align:center; color:#666; }
    .part-a-table .q-marks { width:40px; text-align:center; font-weight:600; }

    /* Part B */
    .part-b-section { margin-bottom:20px; }
    .unit-label {
      font-size:12px; font-weight:700; text-transform:uppercase;
      letter-spacing:0.05em; background:#f5f5f5; border:1px solid #ccc;
      padding:6px 10px; display:flex; justify-content:space-between;
    }
    .or-pair { display:flex; flex-direction:column; gap:0; }
    .or-row { padding:10px 12px; border:1px solid #ccc; border-top:none; font-size:12.5px; line-height:1.65; }
    .or-divider {
      text-align:center; font-weight:700; font-size:11px; letter-spacing:0.1em;
      padding:5px; background:#fafafa; border:1px solid #ccc; border-top:none;
      color:#888;
    }
    .q-letter { font-weight:700; margin-right:8px; }

    /* Watermark */
    .draft-watermark {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      pointer-events:none; opacity:0.04; transform:rotate(-30deg);
      font-size:72px; font-weight:900; color:#000; letter-spacing:0.2em;
      font-family:'Google Sans',sans-serif; text-transform:uppercase;
      user-select:none;
    }

    /* Empty state */
    .empty-state {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:80px 40px; text-align:center; color:var(--text-muted);
      background:var(--surface-2); border:1px solid rgba(255,255,255,0.07);
      border-radius:16px; max-width:740px; margin:0 auto;
    }
    .empty-icon { font-size:48px; margin-bottom:16px; }
    .empty-state h3 { font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:8px; }
    .empty-state p { font-size:13px; line-height:1.6; max-width:320px; }
    .btn-go-hod {
      margin-top:20px; background:var(--teal); border:none; color:#fff;
      font-size:13px; font-weight:600; padding:10px 22px; border-radius:10px;
      cursor:pointer; text-decoration:none; font-family:'Google Sans',sans-serif;
      transition:all 0.2s; display:inline-block;
    }
    .btn-go-hod:hover { background:#059669; transform:translateY(-1px); }

    /* Toast */
    .toast {
      position:fixed; bottom:24px; right:24px; font-size:14px;
      padding:13px 20px; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.4);
      transform:translateY(80px); opacity:0;
      transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1); z-index:200;
    }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.success { background:#064e3b; color:#34d399; border:1px solid rgba(52,211,153,0.2); }
    .toast.error { background:#450a0a; color:#f87171; border:1px solid rgba(248,113,113,0.2); }

    /* Print styles */
    @media print {
      body { background:#fff; display:block; }
      .sidebar, .topbar, .controls-col, .toast { display:none !important; }
      .content { display:block; padding:0; }
      .paper-col { width:100%; }
      .paper-sheet { box-shadow:none; border-radius:0; max-width:100%; padding:24px; }
      .draft-watermark { display:none; }
    }

    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--surface-3); border-radius:99px; }
  </style>
</head>
<body>

  <!-- ══ SIDEBAR ══ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">📄</div>
      <div class="sidebar-brand">
        <span class="brand-name">SQPG</span>
        <span class="brand-sub">SVCE</span>
      </div>
    </div>
    <button class="collapse-btn" onclick="toggleSidebar()">‹</button>

    <nav class="sidebar-nav">
      <div class="nav-section-label">Navigation</div>
      <a href="teacher.html" class="nav-item" data-tooltip="Upload">
        <span class="nav-icon">📤</span>
        <span class="nav-label">Upload Paper</span>
      </a>
      <a href="hod.html" class="nav-item" data-tooltip="Generate">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Generate Paper</span>
      </a>
      <a href="preview.html" class="nav-item active" data-tooltip="Preview">
        <span class="nav-icon">👁</span>
        <span class="nav-label">Preview Paper</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card" onclick="logout()">
        <div class="avatar" id="userAvatar">U</div>
        <div class="user-info">
          <div class="user-name" id="userName">User</div>
          <div class="user-role">Sign out</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ══ MAIN ══ -->
  <main class="main">

    <div class="topbar">
      <div class="topbar-left">
        <h1>Paper Preview</h1>
        <p id="paperMeta">Loading paper data…</p>
      </div>
      <div class="topbar-actions">
        <button class="btn-ghost" onclick="window.print()">🖨 Print</button>
        <button class="btn-ghost" onclick="window.location.href='hod.html'">← Regenerate</button>
        <button class="btn-export" id="exportBtn" onclick="handleExport()">
          ⬇ Export PDF
        </button>
      </div>
    </div>

    <div class="content" id="mainContent">
      <!-- Populated by JS -->
    </div>

  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    /* ── Backend API base (Spring Boot on port 8080) ── */
    const API_BASE = 'http://localhost:8080';

    /* ── Auth (inlined) ── */
    function getUser() { try { return JSON.parse(localStorage.getItem('sqpg_user')); } catch { return null; } }
    function getToken() { return localStorage.getItem('sqpg_token'); }

    /* ── Auth guard ── */
    (function() {
      const token = getToken();
      const user = getUser();
      if (!token || !user) { window.location.href = 'login.html'; return; }
      const initials = (user.name || 'U').split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
      document.getElementById('userAvatar').textContent = initials;
      document.getElementById('userName').textContent = user.name || user.role || 'User';
    })();

    /* ── State ── */
    let sidebarCollapsed = false;
    let activePart = 'A';

    /**
     * Toggle sidebar
     */
    function toggleSidebar() {
      sidebarCollapsed = !sidebarCollapsed;
      document.getElementById('sidebar').classList.toggle('collapsed', sidebarCollapsed);
    }

    /**
     * Logout
     */
    function logout() {
      localStorage.removeItem('sqpg_token');
      localStorage.removeItem('sqpg_user');
      sessionStorage.removeItem('sqpg_pending_role');
      Object.keys(localStorage).filter(k => k.startsWith('sb-')).forEach(k => localStorage.removeItem(k));
      window.location.href = 'login.html';
    }

    /**
     * Show toast
     */
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.className = `toast ${type} show`;
      t.textContent = msg;
      setTimeout(() => t.classList.remove('show'), 3500);
    }

    /**
     * Switch visible part (A or B) in the paper
     * @param {string} part - 'A' or 'B'
     */
    function switchPart(part) {
      activePart = part;
      document.querySelectorAll('.part-tab').forEach(t => t.classList.toggle('active', t.dataset.part === part));
      document.getElementById('partA').style.display = part === 'A' ? 'block' : 'none';
      document.getElementById('partB').style.display = part === 'B' ? 'block' : 'none';
    }

    /**
     * Handle export button — calls GET /api/export to download the PDF.
     * Uses subjectCode/examCode saved from generate-step so query params match backend.
     */
    async function handleExport() {
      const paper = getPaper();
      if (!paper) return;

      const btn = document.getElementById('exportBtn');
      btn.disabled = true;
      btn.innerHTML = '⏳ Exporting…';

      try {
        const subject = paper.subjectCode || paper.subject;
        const exam = paper.examCode || paper.exam;
        const difficulty = paper.mode || 'medium';

        const url = `${API_BASE}/api/export?subject=${encodeURIComponent(subject)}`
          + `&exam=${encodeURIComponent(exam)}&difficulty=${encodeURIComponent(difficulty)}`;
        const res = await fetch(url, {
          headers: {
            'Authorization': 'Bearer ' + (getToken() || ''),
            'X-User-Role': ((getUser() || {}).role || '')
          }
        });
        if (!res.ok) throw new Error(await res.text());

        const blob = await res.blob();
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `paper_${subject}_${exam}_${difficulty}.pdf`;
        document.body.appendChild(link);
        link.click();
        setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 0);

        const count = parseInt(localStorage.getItem('sqpg_exp_count') || '0') + 1;
        localStorage.setItem('sqpg_exp_count', count);
        showToast('✓ PDF downloaded successfully!', 'success');
      } catch (err) {
        showToast('Export failed: ' + (err.message || 'unknown error'), 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '⬇ Export PDF';
      }
    }

    /**
     * Read paper data from localStorage
     * @returns {Object|null}
     */
    function getPaper() {
      try { return JSON.parse(localStorage.getItem('sqpg_paper')); } catch { return null; }
    }

    /**
     * Render the full paper UI based on localStorage data
     */
    function renderPage() {
      const paper = getPaper();
      const container = document.getElementById('mainContent');

      if (!paper) {
        // Empty state
        container.innerHTML = `
          <div style="flex:1; display:flex; align-items:center; justify-content:center; width:100%;">
            <div class="empty-state">
              <div class="empty-icon">📭</div>
              <h3>No paper generated yet</h3>
              <p>Go to the HOD dashboard, select a subject and exam type, then click Generate.</p>
              <a href="hod.html" class="btn-go-hod">Go to HOD Dashboard →</a>
            </div>
          </div>
        `;
        document.getElementById('paperMeta').textContent = 'No data — generate a paper first';
        document.getElementById('exportBtn').disabled = true;
        return;
      }

      document.getElementById('paperMeta').textContent =
        `${paper.subject} · ${paper.exam} · Generated ${new Date(paper.generatedAt).toLocaleString('en-IN', { dateStyle:'medium', timeStyle:'short' })}`;

      container.innerHTML = `
        <!-- Controls column -->
        <div class="controls-col">
          <!-- Paper info -->
          <div class="ctrl-card">
            <div class="ctrl-title">Paper Info</div>
            <div class="ctrl-item"><span class="label">Subject</span><span class="value" style="max-width:110px;text-align:right;font-size:11px;">${paper.subject}</span></div>
            <div class="ctrl-item"><span class="label">Exam</span><span class="value" style="max-width:110px;text-align:right;font-size:11px;">${paper.exam}</span></div>
            <div class="ctrl-item"><span class="label">Mode</span><span class="value">${(paper.mode||'auto').charAt(0).toUpperCase()+(paper.mode||'auto').slice(1)}</span></div>
            <div class="ctrl-item"><span class="label">Part A Qs</span><span class="value">${paper.partA?.length || 0}</span></div>
            <div class="ctrl-item"><span class="label">Part B Units</span><span class="value">${paper.partB?.length || 0}</span></div>
          </div>

          <!-- Part switcher -->
          <div class="ctrl-card">
            <div class="ctrl-title">Sections</div>
            <div class="part-tab-row">
              <div class="part-tab active" data-part="A" onclick="switchPart('A')">
                📋 Part A
                <span class="tab-badge">${paper.partA?.length || 0} Qs</span>
              </div>
              <div class="part-tab" data-part="B" onclick="switchPart('B')">
                📝 Part B
                <span class="tab-badge">${paper.partB?.length || 0} Units</span>
              </div>
            </div>
          </div>

          <!-- Marks summary -->
          <div class="ctrl-card">
            <div class="ctrl-title">Marks</div>
            <div class="ctrl-item"><span class="label">Part A</span><span class="value">${(paper.partA?.length||0)*2} marks</span></div>
            <div class="ctrl-item"><span class="label">Part B</span><span class="value">${(paper.partB?.length||0)*16} marks</span></div>
            <div class="ctrl-item"><span class="label">Total</span><span class="value" style="color:#818cf8">${(paper.partA?.length||0)*2 + (paper.partB?.length||0)*16} marks</span></div>
          </div>
        </div>

        <!-- Paper column -->
        <div class="paper-col">
          <div class="paper-sheet">
            <div class="draft-watermark">DRAFT</div>

            <!-- College header -->
            <div class="paper-header">
              <div class="paper-institution">Sri Venkateswara College of Engineering</div>
              <div class="paper-dept">Autonomous Institution — Affiliated to Anna University, Chennai</div>
              <div class="paper-title">${paper.exam}</div>
              <div class="paper-sub">${paper.subject}</div>
            </div>

            <!-- Meta row -->
            <div class="paper-meta">
              <div class="meta-cell">
                <div class="meta-label">Duration</div>
                <div class="meta-val">3 Hours</div>
              </div>
              <div class="meta-cell">
                <div class="meta-label">Maximum Marks</div>
                <div class="meta-val">${(paper.partA?.length||0)*2 + (paper.partB?.length||0)*16}</div>
              </div>
              <div class="meta-cell">
                <div class="meta-label">Date</div>
                <div class="meta-val">${new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' })}</div>
              </div>
            </div>

            <!-- PART A -->
            <div id="partA">
              <div class="part-heading">
                <span>Part A — Short Answer Questions</span>
                <span style="font-weight:400;font-size:11px;">(Answer ALL — 2 marks each)</span>
              </div>
              <div class="part-instruction">Answer ALL questions. Each question carries 2 marks. (${paper.partA?.length||0} × 2 = ${(paper.partA?.length||0)*2} Marks)</div>
              <table class="part-a-table">
                <thead>
                  <tr>
                    <th class="q-num">Q.No</th>
                    <th>Question</th>
                    <th class="q-unit">Unit</th>
                    <th class="q-marks">Marks</th>
                  </tr>
                </thead>
                <tbody>
                  ${(paper.partA||[]).map((q, i) => `
                    <tr>
                      <td class="q-num">${i+1}.</td>
                      <td>${q.q}</td>
                      <td class="q-unit">${q.unit}</td>
                      <td class="q-marks">2</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <!-- PART B -->
            <div id="partB" style="display:none;">
              <div class="part-heading">
                <span>Part B — Long Answer Questions</span>
                <span style="font-weight:400;font-size:11px;">(Answer ALL — 16 marks each)</span>
              </div>
              <div class="part-instruction">Answer ALL questions. Each question carries 16 marks. (${paper.partB?.length||0} × 16 = ${(paper.partB?.length||0)*16} Marks)</div>

              ${(paper.partB||[]).map((pair, i) => `
                <div class="part-b-section">
                  <div class="unit-label">
                    <span>Unit ${pair.unit} — Q${i + paper.partA.length + 1}</span>
                    <span style="font-weight:400;font-size:11px;">16 Marks</span>
                  </div>
                  <div class="or-pair">
                    <div class="or-row"><span class="q-letter">(a)</span>${pair.a}</div>
                    <div class="or-divider">— OR —</div>
                    <div class="or-row"><span class="q-letter">(b)</span>${pair.b}</div>
                  </div>
                </div>
              `).join('')}
            </div>

          </div>
        </div>
      `;
    }

    // Init on load
    window.addEventListener('DOMContentLoaded', renderPage);
  </script>
</body>
</html>
